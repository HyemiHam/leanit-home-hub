name: Deploy to Production

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leanit-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update source and restart service
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
              set -Eeuo pipefail

              cd /home/leanit-admin/dc-react/leanit_home
              git fetch origin prod
              git switch prod
              git pull --ff-only origin prod

              cd /home/leanit-admin/dc-react
              docker compose up -d --build react-home
              docker image prune -f
            REMOTE